<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfil de Reflow — Soldadura SMD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 24px; padding: 32px 16px;
    background: radial-gradient(120% 120% at 50% 0%, #121826 0%, #06080d 60%, #030406 100%);
    color: #e8ecf3;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; opacity: 0.9; text-align: center; }
  h1 span { color: #3fb8ff; }
  .sub { font-size: 13px; opacity: 0.5; text-align: center; margin-top: -16px; }

  #stage-root { width: 100%; display: flex; justify-content: center; }

  /* Controles */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .controls button {
    font-family: inherit; cursor: pointer;
    padding: 9px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    color: #cfd6e2; background: #ffffff08;
    border: 1px solid #ffffff14;
    transition: all .18s ease;
  }
  .controls button:hover { background: #ffffff14; color: #fff; }
  .controls button.active {
    color: #06080d; background: var(--accent, #3fb8ff);
    border-color: transparent;
    box-shadow: 0 6px 20px -6px var(--accent, #3fb8ff);
  }
  .controls button.play { border-color: #ffffff33; }
  .controls button.play.playing { background: #ffffff22; color: #fff; }

  @media (max-width: 820px) {
    #stage-root > div { width: 100% !important; max-width: 760px; }
    body { padding: 20px 8px; }
  }
</style>
</head>
<body>

<h1>Perfil de <span>Reflow</span> — Soldadura SMD</h1>
<p class="sub">Precalentamiento → Remojo → Reflujo → Enfriamiento</p>

<div id="stage-root"></div>

<div class="controls" id="controls">
  <button data-i="0" class="active" style="--accent:#f5b942">01 · Precalentamiento</button>
  <button data-i="1" style="--accent:#ff8a3d">02 · Remojo</button>
  <button data-i="2" style="--accent:#ff4d5e">03 · Reflujo</button>
  <button data-i="3" style="--accent:#3fb8ff">04 · Enfriamiento</button>
  <button class="play" id="playBtn">▶ Reproducir</button>
</div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "framer-motion": "https://esm.sh/framer-motion@11.3.8?external=react"
  }
}
</script>

<script type="module">
import React, { useState, useEffect, useRef } from "react";
import { createRoot } from "react-dom/client";
import { motion, useMotionValue, useTransform, animate } from "framer-motion";

/* ============================================================
   ReflowShared.jsx  (equivalente)
   ============================================================ */

const SEGMENTS = {
  preheat: "M0,130 L80,63",
  soak:    "M80,63 L170,37",
  reflow:  "M170,37 C190,20 200,12 210,12 C220,12 230,22 240,40",
  cooling: "M240,40 L300,115",
};
const FULL = Object.values(SEGMENTS).join(" ").replace(/ M[\d.,]+/g, "");

const font = "'Inter', 'Segoe UI', system-ui, sans-serif";

function TempCounter({ from, to, color, duration = 4 }) {
  const v = useMotionValue(from);
  const rounded = useTransform(v, (t) => `${Math.round(t)}°C`);
  useEffect(() => {
    const c = animate(v, [from, to], {
      duration, ease: "easeInOut", repeat: Infinity, repeatType: "loop", repeatDelay: 0.8,
    });
    return () => c.stop();
  }, [from, to, duration]);
  return (
    <motion.span style={{ color, fontSize: 44, fontWeight: 700, fontVariantNumeric: "tabular-nums" }}>
      {rounded}
    </motion.span>
  );
}

function ProfileChart({ segment, color, duration = 4 }) {
  return (
    <svg viewBox="-10 -5 320 150" style={{ width: "100%" }}>
      {[0, 35, 70, 105, 130].map((y) => (
        <line key={y} x1="0" x2="300" y1={y} y2={y} stroke="#ffffff10" />
      ))}
      <line x1="0" x2="300" y1="27.6" y2="27.6" stroke="#ffffff30" strokeDasharray="4 4" />
      <text x="2" y="23" fill="#ffffff55" fontSize="8" fontFamily={font}>Liquidus 217 °C</text>
      <path d={FULL} fill="none" stroke="#ffffff22" strokeWidth="2" />
      <motion.path
        d={SEGMENTS[segment]} fill="none" stroke={color} strokeWidth="3.5" strokeLinecap="round"
        style={{ filter: `drop-shadow(0 0 6px ${color})` }}
        initial={{ pathLength: 0 }} animate={{ pathLength: 1 }}
        transition={{ duration, ease: "easeInOut", repeat: Infinity, repeatDelay: 0.8 }}
      />
    </svg>
  );
}

function StageCard({ step, title, subtitle, color, metrics, segment, temp, children }) {
  return (
    <motion.div
      initial={{ opacity: 0, y: 24 }} animate={{ opacity: 1, y: 0 }}
      transition={{ duration: 0.7, ease: [0.22, 1, 0.36, 1] }}
      style={{
        fontFamily: font, color: "#e8ecf3", width: 760, padding: 28, borderRadius: 24,
        background: "radial-gradient(120% 140% at 0% 0%, #1b2233 0%, #0b0f17 60%)",
        border: "1px solid #ffffff14",
        boxShadow: `0 30px 80px -30px ${color}55, inset 0 1px 0 #ffffff10`,
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 20 }}>
        <div style={{
          width: 42, height: 42, borderRadius: 12, display: "grid", placeItems: "center",
          background: `${color}22`, color, fontWeight: 700, border: `1px solid ${color}55`,
        }}>{step}</div>
        <div>
          <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: -0.3 }}>{title}</div>
          <div style={{ fontSize: 13, opacity: 0.6 }}>{subtitle}</div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.15fr 1fr", gap: 22 }}>
        <div style={{ background: "#ffffff06", borderRadius: 16, border: "1px solid #ffffff0d", overflow: "hidden" }}>
          <svg viewBox="0 0 320 200" style={{ width: "100%", display: "block" }}>{children}</svg>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <TempCounter {...temp} color={color} />
          <ProfileChart segment={segment} color={color} duration={temp.duration} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {metrics.map(([k, v]) => (
              <div key={k} style={{ background: "#ffffff08", borderRadius: 10, padding: "8px 10px" }}>
                <div style={{ fontSize: 10, opacity: 0.5, textTransform: "uppercase", letterSpacing: 1 }}>{k}</div>
                <div style={{ fontSize: 14, fontWeight: 600 }}>{v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </motion.div>
  );
}

function PCB({ chipX = 0, padColor = "#c9a24b", chip = true }) {
  return (
    <g>
      <rect x="20" y="130" width="280" height="22" rx="4" fill="#0f5132" />
      <rect x="20" y="130" width="280" height="3" fill="#ffffff18" />
      <rect x="85" y="124" width="40" height="6" rx="1.5" fill={padColor} />
      <rect x="195" y="124" width="40" height="6" rx="1.5" fill={padColor} />
      {chip && (
        <motion.g animate={{ x: chipX }} transition={{ duration: 1.2, ease: "easeOut" }}>
          <rect x="100" y="96" width="120" height="26" rx="4" fill="#1d1f24" stroke="#ffffff22" />
          <rect x="95" y="100" width="12" height="20" fill="#b8bec9" />
          <rect x="213" y="100" width="12" height="20" fill="#b8bec9" />
          <text x="160" y="113" textAnchor="middle" fill="#ffffff66" fontSize="9" fontFamily={font}>R 0805</text>
        </motion.g>
      )}
    </g>
  );
}

/* ============================================================
   Etapa 1 — Precalentamiento
   ============================================================ */
function Stage1Preheat() {
  const C = "#f5b942";
  return (
    <StageCard
      step="01" title="Precalentamiento" subtitle="Rampa controlada desde temperatura ambiente"
      color={C} segment="preheat" temp={{ from: 25, to: 150, duration: 4 }}
      metrics={[["Rango", "25 → 150 °C"], ["Rampa", "1 – 3 °C/s"], ["Duración", "60 – 90 s"], ["Objetivo", "Evitar choque térmico"]]}
    >
      <motion.rect x="20" y="126" width="280" height="30" rx="6" fill={C}
        animate={{ opacity: [0, 0.35, 0] }} transition={{ duration: 4.8, repeat: Infinity }}
        style={{ filter: "blur(10px)" }} />
      <PCB />
      {[95, 205].map((x) => (
        <rect key={x} x={x} y="118" width="20" height="6" rx="3" fill="#8d939c" />
      ))}
      {[50, 100, 150, 200, 250].map((x, i) => (
        <motion.path key={x}
          d={`M${x},195 q8,-10 0,-20 q-8,-10 0,-20`}
          fill="none" stroke={C} strokeWidth="2" strokeLinecap="round"
          initial={{ y: 10, opacity: 0 }}
          animate={{ y: -20, opacity: [0, 0.9, 0] }}
          transition={{ duration: 2, delay: i * 0.3, repeat: Infinity, ease: "easeOut" }} />
      ))}
      <motion.text x="300" y="40" textAnchor="end" fill={C} fontSize="12" fontWeight="600"
        animate={{ opacity: [0.4, 1, 0.4] }} transition={{ duration: 1.6, repeat: Infinity }}>
        ▲ +2 °C/s
      </motion.text>
    </StageCard>
  );
}

/* ============================================================
   Etapa 2 — Remojo térmico
   ============================================================ */
function Stage2Soak() {
  const C = "#ff8a3d";
  return (
    <StageCard
      step="02" title="Remojo térmico" subtitle="Activación del flux y equilibrio de temperatura"
      color={C} segment="soak" temp={{ from: 150, to: 200, duration: 4 }}
      metrics={[["Rango", "150 → 200 °C"], ["Duración", "60 – 120 s"], ["Flux", "Elimina óxidos"], ["ΔT placa", "→ mínimo"]]}
    >
      <PCB />
      {[95, 205].map((x) => (
        <rect key={x} x={x} y="118" width="20" height="6" rx="3" fill="#9aa0a8" />
      ))}
      {Array.from({ length: 10 }).map((_, i) => {
        const x = (i % 2 ? 205 : 95) + 4 + (i * 7) % 14;
        return (
          <motion.circle key={i} cx={x} cy="116" r={2 + (i % 3)} fill="none" stroke={C} strokeWidth="1.2"
            animate={{ cy: [116, 70], opacity: [0, 0.9, 0], scale: [0.6, 1.3] }}
            transition={{ duration: 2.2, delay: i * 0.22, repeat: Infinity, ease: "easeOut" }} />
        );
      })}
      {[{ x: 30, from: 30, label: "Borde" }, { x: 280, from: 60, label: "Centro" }].map((t) => (
        <g key={t.x}>
          <rect x={t.x - 4} y="20" width="8" height="80" rx="4" fill="#ffffff12" />
          <motion.rect x={t.x - 4} width="8" rx="4" fill={C}
            animate={{ height: [t.from, 70, 70], y: [100 - t.from, 30, 30] }}
            transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.7, 1] }} />
          <text x={t.x} y="14" textAnchor="middle" fill="#ffffff80" fontSize="8">{t.label}</text>
        </g>
      ))}
      <motion.text x="160" y="40" textAnchor="middle" fill={C} fontSize="11" fontWeight="600"
        animate={{ opacity: [0, 0, 1, 1] }} transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.6, 0.75, 1] }}>
        ΔT ≈ 0 · Equilibrado
      </motion.text>
    </StageCard>
  );
}

/* ============================================================
   Etapa 3 — Reflujo
   ============================================================ */
function Joint({ x }) {
  const grains = Array.from({ length: 8 });
  return (
    <g>
      {grains.map((_, i) => (
        <motion.circle key={i} cx={x + 3 + (i % 4) * 5} cy={i < 4 ? 121 : 117} r="2.6" fill="#a7adb6"
          animate={{ opacity: [1, 1, 0, 0], cx: [x + 3 + (i % 4) * 5, x + 10] }}
          transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.35, 0.55, 1] }} />
      ))}
      <motion.path
        d={`M${x - 6},124 Q${x + 10},96 ${x + 26},124 Z`}
        fill="url(#molten)"
        animate={{ opacity: [0, 0, 1, 1], scaleY: [0.2, 0.2, 1, 1] }}
        style={{ originY: 1 }}
        transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.4, 0.6, 1] }} />
    </g>
  );
}

function Stage3Reflow() {
  const C = "#ff4d5e";
  return (
    <StageCard
      step="03" title="Reflujo" subtitle="Fusión de la aleación y formación de la unión"
      color={C} segment="reflow" temp={{ from: 200, to: 245, duration: 4 }}
      metrics={[["Pico", "235 – 250 °C"], ["TAL >217 °C", "30 – 90 s"], ["Aleación", "SAC305"], ["Efecto", "Autoalineación"]]}
    >
      <defs>
        <linearGradient id="molten" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#ffffff" />
          <stop offset="40%" stopColor="#ffd2a0" />
          <stop offset="100%" stopColor="#d9dde3" />
        </linearGradient>
      </defs>
      <motion.rect x="0" y="0" width="320" height="200" fill={C}
        animate={{ opacity: [0, 0.08, 0.14, 0] }} transition={{ duration: 4.8, repeat: Infinity }} />
      <PCB chip={false} />
      <Joint x={95} />
      <Joint x={205} />
      <motion.g animate={{ x: [10, 10, 0, 0], rotate: [2.5, 2.5, 0, 0] }}
        style={{ originX: "160px", originY: "109px" }}
        transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.5, 0.7, 1], ease: "easeOut" }}>
        <rect x="100" y="96" width="120" height="26" rx="4" fill="#1d1f24" stroke="#ffffff22" />
        <rect x="95" y="100" width="12" height="20" fill="#b8bec9" />
        <rect x="213" y="100" width="12" height="20" fill="#b8bec9" />
      </motion.g>
      <motion.text x="160" y="40" textAnchor="middle" fill={C} fontSize="12" fontWeight="700"
        animate={{ opacity: [0, 0, 1, 0] }} transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.45, 0.6, 1] }}>
        ● LIQUIDUS SUPERADO
      </motion.text>
    </StageCard>
  );
}

/* ============================================================
   Etapa 4 — Enfriamiento
   ============================================================ */
function Stage4Cooling() {
  const C = "#3fb8ff";
  return (
    <StageCard
      step="04" title="Enfriamiento" subtitle="Solidificación controlada de la unión"
      color={C} segment="cooling" temp={{ from: 245, to: 60, duration: 4 }}
      metrics={[["Rampa", "−2 a −4 °C/s"], ["Salida", "< 60 °C"], ["Grano", "Fino y resistente"], ["Evita", "Fisuras / tombstoning"]]}
    >
      {[40, 70, 160, 185].map((y, i) => (
        <motion.line key={y} x1="-40" x2="20" y1={y} y2={y} stroke={C} strokeWidth="2" strokeLinecap="round"
          animate={{ x: [0, 360], opacity: [0, 0.8, 0] }}
          transition={{ duration: 1.8, delay: i * 0.35, repeat: Infinity, ease: "linear" }} />
      ))}
      <PCB />
      {[95, 205].map((x) => (
        <g key={x}>
          <motion.path d={`M${x - 6},124 Q${x + 10},98 ${x + 26},124 Z`}
            animate={{ fill: ["#ffb070", "#ffb070", "#cfd5dd", "#cfd5dd"] }}
            transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.2, 0.8, 1] }} />
          <motion.path d={`M${x + 2},118 Q${x + 8},108 ${x + 14},106`} fill="none" stroke="#fff" strokeWidth="1.5"
            strokeLinecap="round"
            animate={{ opacity: [0, 0, 0, 1, 0] }}
            transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.7, 0.78, 0.88, 1] }} />
        </g>
      ))}
      {[120, 160, 200].map((x, i) => (
        <motion.text key={x} x={x} y="60" textAnchor="middle" fill={C} fontSize="14"
          animate={{ y: [40, 80], opacity: [0, 1, 0], rotate: [0, 90] }}
          transition={{ duration: 2.4, delay: i * 0.5, repeat: Infinity }}>
          ❄
        </motion.text>
      ))}
      <motion.text x="300" y="190" textAnchor="end" fill={C} fontSize="11" fontWeight="600"
        animate={{ opacity: [0, 0, 1, 1] }} transition={{ duration: 4.8, repeat: Infinity, times: [0, 0.75, 0.85, 1] }}>
        ✓ Unión solidificada
      </motion.text>
    </StageCard>
  );
}

/* ============================================================
   App
   ============================================================ */
const STAGES = [Stage1Preheat, Stage2Soak, Stage3Reflow, Stage4Cooling];
const ACCENTS = ["#f5b942", "#ff8a3d", "#ff4d5e", "#3fb8ff"];

function App() {
  const [index, setIndex] = useState(0);
  const [playing, setPlaying] = useState(false);
  const timerRef = useRef(null);

  // Autoplay: avanza de etapa cada 6 s
  useEffect(() => {
    if (playing) {
      timerRef.current = setInterval(() => {
        setIndex((i) => (i + 1) % STAGES.length);
      }, 6000);
    }
    return () => clearInterval(timerRef.current);
  }, [playing]);

  // Refresca los botones activos
  useEffect(() => {
    document.querySelectorAll("#controls button[data-i]").forEach((btn) => {
      const active = Number(btn.dataset.i) === index;
      btn.classList.toggle("active", active);
    });
  }, [index]);

  const Stage = STAGES[index];

  return (
    <React.Fragment>
      <div id="stage-root-inner">
        {/* key fuerza el remount para reiniciar animaciones al cambiar de etapa */}
        <Stage key={index} />
      </div>
      <StageControls
        index={index}
        playing={playing}
        onSelect={(i) => { setIndex(i); setPlaying(false); }}
        onTogglePlay={() => setPlaying((p) => !p)}
      />
    </React.Fragment>
  );
}

function StageControls({ index, playing, onSelect, onTogglePlay }) {
  const labels = ["01 · Precalentamiento", "02 · Remojo", "03 · Reflujo", "04 · Enfriamiento"];
  return (
    <div className="controls" id="controls">
      {labels.map((label, i) => (
        <button
          key={i}
          data-i={i}
          className={index === i ? "active" : ""}
          style={{ "--accent": ACCENTS[i] }}
          onClick={() => onSelect(i)}
        >
          {label}
        </button>
      ))}
      <button className={"play" + (playing ? " playing" : "")} onClick={onTogglePlay}>
        {playing ? "⏸ Pausar" : "▶ Reproducir"}
      </button>
    </div>
  );
}

// Render
const rootEl = document.createElement("div");
rootEl.style.display = "flex";
rootEl.style.flexDirection = "column";
rootEl.style.alignItems = "center";
rootEl.style.gap = "24px";
rootEl.style.width = "100%";
document.body.insertBefore(rootEl, document.getElementById("controls").parentNode);
// Reemplazamos el placeholder #stage-root
document.getElementById("stage-root").remove();
rootEl.id = "stage-root";

createRoot(rootEl).render(<App />);
</script>
</body>
  </html>
