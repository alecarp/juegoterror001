header{height:60px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:12px}
.logo{font-weight:900;display:flex;align-items:center;gap:8px}.badge{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:900}
.search{flex:1;max-width:380px;position:relative}.search input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:9px 10px 9px 34px;border-radius:10px;outline:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.hdr{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:10px;cursor:pointer;font-size:12px}

.main{display:flex;flex:1;min-height:0}.sidebar{width:360px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.cat-list{padding:10px;display:flex;flex-direction:column;gap:4px;max-height:32%;overflow:auto;border-bottom:1px solid var(--border)}
.cat-btn{padding:9px 10px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;font-size:12px;text-align:left}

.player{flex:1;display:flex;flex-direction:column;background:#000;min-width:0;position:relative}.video-box{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;background:#000}.overlay{position:absolute;inset:0;pointer-events:none;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.chip{pointer-events:auto;background:rgba(18,19,26,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);padding:6px 10px;border-radius:999px;font-size:11px;display:flex;gap:6px;align-items:center}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(12,13,20,.96);border:1px solid var(--border);padding:16px 18px;border-radius:14px;display:none;flex-direction:column;gap:8px;z-index:10;max-width:88%;text-align:center}

.bar{height:66px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px}
.info{flex:1;min-width:0}.title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
const raw = JSON.parse(document.getElementById('data').textContent);
let all = raw.channels;
let cats = raw.categories;
const video = document.getElementById('video');
const q = document.getElementById('q');
const catList = document.getElementById('catList');
const chanList = document.getElementById('chanList');
const cnt = document.getElementById('cnt');
const status = document.getElementById('status');
const stxt = document.getElementById('stxt');
const ssub = document.getElementById('ssub');
const ititle = document.getElementById('ititle');
const iurl = document.getElementById('iurl');
const nowChip = document.getElementById('nowChip');
const nowName = document.getElementById('nowName');
const nowCat = document.getElementById('nowCat');
const nowLogo = document.getElementById('nowLogo');
const dbg = document.getElementById('dbg');
const cdnSel = document.getElementById('cdnBase');
const proxyChk = document.getElementById('proxyChk');
const retryBtn = document.getElementById('retryBtn');

let selCat=null, filtered=[], curIdx=-1, showAdult=false, shakaPlayer=null, hlsInst=null;
let lastError=null;

const CDN_LIST = [
  "https://cdn.cvattv.com.ar/",
  "https://live.cvattv.com.ar/",
  "https://edge5-hr.cvattv.com.ar/",
  "https://flow-live.qwilted-cds.cqloud.com/"
];

function log(m){ dbg.textContent = new Date().toLocaleTimeString()+" - "+m+"\n"+dbg.textContent; console.log(m); }

function b64urlToBytes(s){ let b=s.replace(/-/g,'+').replace(/_/g,'/'); b+='='.repeat((4-b.length%4)%4); const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function bytesToHex(u){ return Array.from(u).map(x=>x.toString(16).padStart(2,'0')).join(''); }
function parseCK(str){ if(!str) return null; let kid=null,k=null; str.split(',').forEach(p=>{const [a,b]=p.split(':'); if(a==='kid') kid=b; if(a==='k') k=b;}); if(!kid||!k) return null; try{ return {kidHex:bytesToHex(b64urlToBytes(kid)), keyHex:bytesToHex(b64urlToBytes(k))}; }catch(e){return null;} }

function getCandidates(ch){
  const orig = ch.original_url;
  const list=[];
  if(orig.startsWith('live/')){
    if(cdnSel.value==='auto'){
      CDN_LIST.forEach(base=>list.push(base+orig));
      // also try lowercased folder variant SA_Live_dash_enc -> sa_live_dash_enc_2a
      CDN_LIST.forEach(base=>list.push(base+orig.replace('SA_Live_dash_enc','sa_live_dash_enc_2a')));
      CDN_LIST.forEach(base=>list.push(base+orig.toLowerCase()));
    } else {
      list.push(cdnSel.value+orig);
      list.push(cdnSel.value+orig.replace('SA_Live_dash_enc','sa_live_dash_enc_2a'));
    }
  } else {
    list.push(ch.url);
  }
  // dedup
  return [...new Set(list)];
}
function withProxy(url){ if(!proxyChk.checked) return url; return "https://corsproxy.io/?"+encodeURIComponent(url); }

function showStat(t,s,spin=true){ stxt.textContent=t; ssub.textContent=s||''; document.getElementById('spin').style.display=spin?'block':'none'; status.classList.add('show'); retryBtn.style.display='none'; }
function hideStat(){ status.classList.remove('show'); }
function showErr(t,s){ stxt.textContent=t; ssub.textContent=s; document.getElementById('spin').style.display='none'; status.classList.add('show'); retryBtn.style.display=proxyChk.checked?'none':'block'; }

function renderCats(){
  catList.innerHTML='';
  const b=document.createElement('button'); b.className='cat-btn'+(selCat===null?' active':''); b.innerHTML='<span>⭐ Todos</span><span class="badge2">'+all.length+'</span>'; b.onclick=()=>{selCat=null;renderCats();renderChans();}; catList.appendChild(b);
  cats.forEach(c=>{
    const ct=all.filter(x=>x.category===c).length;
    if(c==='ADULTOS'&&!showAdult) return;
    const btn=document.createElement('button'); btn.className='cat-btn'+(selCat===c?' active':''); btn.innerHTML='<span>'+c+'</span><span class="badge2">'+ct+'</span>'; btn.onclick=()=>{selCat=c;renderCats();renderChans();}; catList.appendChild(btn);
  });
}
function renderChans(){
  const qq=q.value.toLowerCase();
  filtered=all.filter(c=>{ if(!showAdult&&c.category==='ADULTOS') return false; if(selCat&&c.category!==selCat) return false; if(qq&&!c.name.toLowerCase().includes(qq)&&!c.category.toLowerCase().includes(qq)) return false; return true; });
  chanList.innerHTML='';
  filtered.forEach(ch=>{
    const d=document.createElement('div'); d.className='chan'+(curIdx>=0&&all[curIdx]===ch?' active':'');
    d.innerHTML='<img class="chan-logo" src="'+ch.icon+'" onerror="this.style.display=\'none\'" loading="lazy"/><div style="flex:1;min-width:0"><div class="chan-name">'+ch.name+'</div><div class="chan-cat">'+ch.category+'</div></div><span class="badge2">'+(ch.original_url.includes('m3u8')?'HLS':'DASH')+'</span>';
    d.onclick=()=>playGlobal(ch); chanList.appendChild(d);
  });
  cnt.textContent='• '+filtered.length+'/'+all.length;
}

async function initShaka(){
  if(shakaPlayer){ try{await shakaPlayer.unload();}catch(e){} shakaPlayer.destroy(); }
  shaka.polyfill.installAll();
  shakaPlayer=new shaka.Player(video);
  shakaPlayer.addEventListener('error', e=>{ log('Shaka error: '+JSON.stringify(e.detail)); showErr('Error Shaka', e.detail.message||JSON.stringify(e.detail).slice(0,300)); });
  const net=shakaPlayer.getNetworkingEngine();
  net.registerRequestFilter((type,req)=>{
    if(curIdx>=0){
      const ch=all[curIdx];
      if(ch.headers){
        if(ch.headers.Referer) req.headers['Referer']=ch.headers.Referer;
        if(ch.headers.Origin) req.headers['Origin']=ch.headers.Origin;
      }
    }
    // if proxy, rewrite URL
    if(proxyChk.checked && !req.uris[0].includes('corsproxy.io')){
      req.uris[0]=withProxy(req.uris[0]);
    }
  });
}

async function playGlobal(ch){
  curIdx=all.indexOf(ch);
  renderChans();
  await playCur();
}

async function tryLoadUrl(url, ck){
  log('Probando URL: '+url);
  if(hlsInst){ hlsInst.destroy(); hlsInst=null; }
  await shakaPlayer.unload().catch(()=>{});
  if(ck){ const m={}; m[ck.kidHex]=ck.keyHex; shakaPlayer.configure({drm:{clearKeys:m}}); } else shakaPlayer.configure({drm:{clearKeys:{}}});
  const isHls=url.includes('.m3u8');
  if(isHls && !ck && typeof Hls!=='undefined' && Hls.isSupported()){
    // use hls.js when no DRM
    return new Promise((resolve,reject)=>{
      hlsInst=new Hls({xhrSetup:(xhr, u)=>{ if(proxyChk.checked) { /* already proxied */ } }});
      hlsInst.loadSource(proxyChk.checked? withProxy(url): url);
      hlsInst.attachMedia(video);
      hlsInst.on(Hls.Events.MANIFEST_PARSED, ()=>{ video.play().then(resolve).catch(resolve); });
      hlsInst.on(Hls.Events.ERROR, (ev,data)=>{ if(data.fatal){ reject(data); } });
      setTimeout(()=>reject('timeout hls'), 12000);
    });
  } else {
    const loadUrl = proxyChk.checked? withProxy(url): url;
    await shakaPlayer.load(loadUrl);
    await video.play().catch(()=>{});
  }
}

async function playCur(){
  if(curIdx<0) return;
  const ch=all[curIdx];
  const ck=parseCK(ch.drm);
  ititle.textContent=ch.name; iurl.textContent=ch.original_url+' • '+(ck?'CLEARKEY':''); nowChip.style.display='flex'; nowName.textContent=ch.name; nowCat.textContent=ch.category; nowLogo.src=ch.icon;
  showStat('Cargando '+ch.name, 'Probando CDN...', true);
  if(!shakaPlayer) await initShaka();
  const candidates=getCandidates(ch);
  log('Candidatos: '+candidates.join(' | '));
  for(let i=0;i<candidates.length;i++){
    const u=candidates[i];
    showStat('Probando '+(i+1)+'/'+candidates.length+' • '+ch.name, u, true);
    try{
      await tryLoadUrl(u, ck);
      hideStat(); log('OK -> '+u); return;
    }catch(e){
      log('Fallo '+u+' -> '+(e.message||JSON.stringify(e).slice(0,200)));
      lastError=e;
      // continue to next
    }
  }
  // all failed
  showErr('No se pudo reproducir '+ch.name, 'Probé '+candidates.length+' URLs. Último error: '+(lastError?.message||JSON.stringify(lastError||'').slice(0,400))+'\nTip: activá Proxy CORS y reintentá, o probá otro canal HTTP (NOVELAS, COCINA, DEPORTE INTERNACIONAL suelen ser públicos).');
}

// controls
q.addEventListener('input', renderChans);
document.getElementById('adultBtn').onclick=()=>{ showAdult=!showAdult; document.getElementById('adultBtn').textContent=showAdult?'🔞 ON':'🔞 OFF'; document.getElementById('adultBtn').classList.toggle('on',showAdult); renderCats(); renderChans(); };
document.getElementById('listBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('fsBtn').onclick=()=>{ const el=document.getElementById('vbox'); document.fullscreenElement? document.exitFullscreen(): el.requestFullscreen(); };
document.getElementById('prev').onclick=()=>{ if(filtered.length){ let idx=filtered.indexOf(all[curIdx]); idx=(idx-1+filtered.length)%filtered.length; playGlobal(filtered[idx]); } };
document.getElementById('next').onclick=()=>{ if(filtered.length){ let idx=filtered.indexOf(all[curIdx]); idx=(idx+1)%filtered.length; playGlobal(filtered[idx]); } };
document.getElementById('play').onclick=()=>{ video.paused? video.play(): video.pause(); };
cdnSel.addEventListener('change', ()=>{ if(curIdx>=0) playCur(); });
proxyChk.addEventListener('change', ()=>{ log('Proxy '+(proxyChk.checked?'ON':'OFF')); if(curIdx>=0) playCur(); });
retryBtn.onclick=()=>{ proxyChk.checked=true; playCur(); };
window.addEventListener('keydown', e=>{ if(e.key==='ArrowDown'){ e.preventDefault(); document.getElementById('next').click(); } if(e.key==='ArrowUp'){ e.preventDefault(); document.getElementById('prev').click(); } if(e.key.toLowerCase()==='f') document.getElementById('fsBtn').click(); });

(async()=>{
  await initShaka();
  renderCats(); renderChans();
  cnt.textContent='• '+all.length+' canales';
  log('Player listo. Tip: los canales Flow (live/*) suelen bloquear CORS. Activá Proxy CORS arriba si fallan. Los canales http (LPF PLAY, NOVELAS, COCINA) deberían funcionar directo.');
  // autoplay first public http to prove it works
  const pub = all.find(c=>c.url.startsWith('http') && !c.url.includes('cvattv') && c.category!=='ADULTOS');
  if(pub){ log('Auto-play público: '+pub.name); playGlobal(pub); }
})();
</script>
